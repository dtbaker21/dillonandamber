<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Send us your address · Dillon &amp; Amber</title>
<meta name="robots" content="noindex">
<meta property="og:title" content="Dillon &amp; Amber are getting married!">
<meta property="og:description" content="Send us your mailing address so we can mail your invitation.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../sub.css">
<script src="../config.js"></script>
</head>
<body>
<header class="top">
  <img src="../img/hero.jpg" alt="Mount Rainier above forested foothills">
  <a class="home" href="../">‹ Our website</a>
  <div class="cap"><h1>Dillon &amp; Amber</h1><p>June 5, 2027 · Snohomish, Washington</p></div>
</header>
<main class="box" id="box">
  <form id="f" novalidate>
    <h2>Where should we mail your invitation?</h2>
    <p class="hint">One form per household is perfect. We'll only use this for wedding mail.</p>
    <div class="grid">
      <div class="c3"><label for="first">First name</label><input id="first" autocomplete="given-name" required></div>
      <div class="c3"><label for="last">Last name</label><input id="last" autocomplete="family-name" required></div>
      <div class="c6"><label for="household">Anyone else at this address? <span class="opt">optional</span></label><input id="household" placeholder="Partner, kids, roommates we know" autocomplete="off"></div>
      <div class="c4"><label for="street">Street address</label><input id="street" autocomplete="address-line1" required></div>
      <div class="c2"><label for="apt">Apt or unit <span class="opt">optional</span></label><input id="apt" autocomplete="address-line2"></div>
      <div class="c3"><label for="city">City</label><input id="city" autocomplete="address-level2" required></div>
      <div class="c3"><label for="state">State</label><input id="state" autocomplete="address-level1" required></div>
      <div class="c3"><label for="zip">ZIP code</label><input id="zip" autocomplete="postal-code" inputmode="numeric" required></div>
      <div class="c3"><label for="country">Country</label><input id="country" autocomplete="country-name" value="United States"></div>
      <div class="c3"><label for="email">Email <span class="opt">optional</span></label><input id="email" type="email" autocomplete="email" placeholder="For RSVP updates"></div>
      <div class="c3"><label for="phone">Phone <span class="opt">optional</span></label><input id="phone" type="tel" autocomplete="tel"></div>
      <input class="hp" id="website" tabindex="-1" autocomplete="off" aria-hidden="true">
    </div>
    <p class="err" id="err" role="alert" hidden></p>
    <button class="pill wide" id="go" type="submit">Send</button>
    <p class="demo" id="demo" hidden>Preview mode: nothing is saved until the Sheet is connected.</p>
  </form>
</main>
<script>
(()=>{
  const $=id=>document.getElementById(id);
  const ep=(window.WEDDING||{}).endpoint;
  if(!ep)$('demo').hidden=false;
  // Prefill from the link, e.g. .../address/?name=Pat%20Baker or ?first=Pat&last=Baker
  const q=new URLSearchParams(location.search);
  const name=(q.get('name')||'').trim().split(/\s+/);
  $('first').value=q.get('first')||(name[0]||'');
  $('last').value=q.get('last')||name.slice(1).join(' ');
  const keys=['first','last','household','street','apt','city','state','zip','country','email','phone','website'];
  $('f').addEventListener('submit',async e=>{
    e.preventDefault();
    const d=Object.fromEntries(keys.map(k=>[k,$(k).value.trim()]));
    const err=m=>{$('err').textContent=m;$('err').hidden=false};
    const miss=['first','last','street','city','state','zip'].find(k=>!d[k]);
    if(miss){err('Please fill in your name and full address.');$(miss).focus();return}
    if(d.email&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.email)){err('That email doesn’t look quite right.');return}
    $('err').hidden=true;$('go').disabled=true;$('go').textContent='Sending';
    try{
      let r={ok:true};
      if(ep)r=await fetch(ep,{method:'POST',body:JSON.stringify({action:'address',...d})}).then(x=>x.json());
      else await new Promise(r=>setTimeout(r,600));
      if(!r.ok)throw new Error(r.error||'');
      $('box').innerHTML=`<div class="done"><div class="ck"><svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="24"/><path d="M15 27l7 7 15-16"/></svg></div><h2>Thank you, ${d.first.replace(/[<>&]/g,'')}!</h2><p class="hint">Keep an eye on your mailbox. In the meantime, our website has travel tips and places to stay.</p><a class="pill wide" href="../">Visit our website</a></div>`;
    }catch(x){$('go').disabled=false;$('go').textContent='Send';err(x.message||'Something went wrong. Please try again in a moment.')}
  });
})();
</script>
</body>
</html>
